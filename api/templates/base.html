<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: letter;
      margin: 0.75in 0.75in 1in 0.75in;
      @bottom-center {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 8pt;
        color: #999;
      }
    }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10pt;
      color: #1a1a1a;
      line-height: 1.4;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1a1a2e;
      padding-bottom: 12pt;
      margin-bottom: 16pt;
    }

    .header-logo {
      font-size: 14pt;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: 1pt;
    }

    .header-badge {
      font-size: 7pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2pt;
      color: #dc2626;
      border: 1px solid #dc2626;
      padding: 2pt 8pt;
    }

    .event-details {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8pt;
      margin-bottom: 20pt;
    }

    .detail-item {
      margin-bottom: 4pt;
    }

    .detail-label {
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 1pt;
      color: #888;
      margin-bottom: 2pt;
    }

    .detail-value {
      font-size: 10pt;
      font-weight: 500;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16pt;
    }

    th {
      font-size: 7pt;
      text-transform: uppercase;
      letter-spacing: 1pt;
      color: #666;
      text-align: left;
      padding: 6pt 8pt;
      border-bottom: 1px solid #ddd;
    }

    th.number { text-align: right; }

    td {
      font-size: 9pt;
      padding: 5pt 8pt;
      border-bottom: 1px solid #f0f0f0;
    }

    td.number {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .section-header td {
      font-size: 9pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
      color: #1a1a2e;
      padding: 8pt 8pt 4pt;
      background: #f8f9fa;
      border-bottom: 1px solid #ddd;
    }

    .subtotal-row td {
      font-weight: 600;
      border-top: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      background: #fafafa;
    }

    .grand-total-row td {
      font-weight: 700;
      font-size: 10pt;
      border-top: 2px solid #1a1a2e;
      padding-top: 8pt;
    }

    .gp-positive { color: #16a34a; }
    .gp-negative { color: #dc2626; }

    .internal-banner {
      background: #fef2f2;
      border: 1px solid #dc2626;
      color: #dc2626;
      text-align: center;
      font-size: 8pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2pt;
      padding: 4pt;
      margin-bottom: 16pt;
    }

    .segment-title {
      font-size: 11pt;
      font-weight: 600;
      color: #1a1a2e;
      margin: 16pt 0 8pt;
      padding-bottom: 4pt;
      border-bottom: 1px solid #e5e7eb;
    }

    .footer-note {
      margin-top: 24pt;
      font-size: 8pt;
      color: #999;
      text-align: center;
    }

    .page-break { page-break-before: always; }

    /* Change order styles */
    .co-header {
      margin-bottom: 16pt;
    }

    .co-number {
      font-size: 12pt;
      font-weight: 700;
      color: #1a1a2e;
    }

    .co-description {
      font-size: 10pt;
      color: #666;
      margin-top: 4pt;
    }

    .delta-added td { color: #16a34a; }
    .delta-removed td { color: #dc2626; }
    .delta-modified td { color: #d97706; }

    .delta-icon {
      font-weight: 700;
      width: 20pt;
    }

    .net-change {
      margin-top: 12pt;
      padding: 8pt;
      background: #f8f9fa;
      border: 1px solid #e5e7eb;
      font-size: 10pt;
    }

    .net-change strong {
      font-size: 11pt;
    }

    /* Recap/variance styles */
    .variance-positive { color: #16a34a; }
    .variance-negative { color: #dc2626; }

    .staff-table {
      margin-top: 16pt;
    }

    .staff-table th {
      background: #f8f9fa;
    }

    .status-badge {
      display: inline-block;
      font-size: 7pt;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1pt;
      padding: 2pt 6pt;
      border-radius: 2pt;
      margin-left: 8pt;
    }

    .status-approved { background: #dcfce7; color: #16a34a; }
    .status-submitted { background: #dbeafe; color: #2563eb; }
    .status-rejected { background: #fef2f2; color: #dc2626; }
    .status-draft { background: #f3f4f6; color: #6b7280; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
